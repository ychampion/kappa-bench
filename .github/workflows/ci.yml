name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.3.13
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Validate tasks
        run: bun run validate
      - name: Self-test
        run: bun run selftest
      - name: Dry run
        run: bun run dry-run --out "$RUNNER_TEMP/dry-run"
      - name: Published results match their re-score
        run: bun run verify-results
      - name: Leaderboard up to date
        run: bun run leaderboard --check
      - name: Charts up to date
        run: bun run charts --check
